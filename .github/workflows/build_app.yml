name: Build Android App

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: 'JSON string containing all build configuration'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Parse Build Config JSON
        env:
          BUILD_CONFIG_JSON: ${{ github.event.inputs.build_config }}
        run: |
          echo "Writing build_config to file..."
          echo "$BUILD_CONFIG_JSON" > build_config.json

      - name: Send Starting Status Callback
        run: |
          BUILD_ID=$(jq -r '.build_id' build_config.json)
          CALLBACK_URL=$(jq -r '.callback_url' build_config.json)
          CALLBACK_TOKEN=$(jq -r '.callback_token' build_config.json)
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"build_id\": \"$BUILD_ID\",
              \"status\": \"building\",
              \"github_run_id\": \"${{ github.run_id }}\",
              \"build_log\": \"[1/4] Setting up build environment...\",
              \"token\": \"$CALLBACK_TOKEN\"
            }" || true

      # ── STEP 1: Inject config.json ────────────────────────────────────────
      - name: Inject App Config
        run: |
          mkdir -p android-template/app/src/main/assets
          python3 -u -c "import json, os;
          config_in = json.load(open('build_config.json'));
          config = {
              'app_name': config_in.get('app_name', 'App'),
              'website_url': config_in.get('website_url', ''),
              'package_name': config_in.get('package_name', ''),
              'enable_pull_refresh': config_in.get('enable_pull_refresh') == 'true',
              'enable_offline_page': config_in.get('enable_offline_page') == 'true',
              'enable_push_notification': config_in.get('enable_push_notification') == 'true',
              'enable_exit_confirmation': config_in.get('enable_exit_confirmation') == 'true',
              'enable_loading_progress_bar': config_in.get('enable_loading_progress_bar') == 'true',
              'enable_external_links_in_browser': config_in.get('enable_external_links_in_browser') == 'true',
              'enable_bottom_navigation': config_in.get('enable_bottom_navigation') == 'true',
              'bottom_navigation_items': json.loads(config_in.get('bottom_navigation_items', '[]')),
              'enable_custom_header': config_in.get('enable_custom_header') == 'true',
              'header_logo_url': config_in.get('header_logo_url', ''),
              'onesignal_app_id': config_in.get('onesignal_app_id', ''),
              'version_name': config_in.get('version_name', '1.0.0'),
              'version_code': int(config_in.get('version_code', '1'))
          };
          open('android-template/app/src/main/assets/config.json', 'w').write(json.dumps(config, indent=2));
          print('config.json written:');
          print(open('android-template/app/src/main/assets/config.json').read())"
        run: |
          mkdir -p android-template/app/src/main/assets
          python3 -u -c "import json, os; config = {'app_name': os.environ.get('APP_NAME', 'App'), 'website_url': os.environ.get('WEBSITE_URL', ''), 'package_name': os.environ.get('PACKAGE_NAME', ''), 'enable_pull_refresh': os.environ.get('ENABLE_PULL_REFRESH') == 'true', 'enable_offline_page': os.environ.get('ENABLE_OFFLINE_PAGE') == 'true', 'enable_push_notification': os.environ.get('ENABLE_PUSH_NOTIFICATION') == 'true', 'enable_exit_confirmation': os.environ.get('ENABLE_EXIT_CONFIRMATION') == 'true', 'enable_loading_progress_bar': os.environ.get('ENABLE_LOADING_PROGRESS_BAR') == 'true', 'enable_external_links_in_browser': os.environ.get('ENABLE_EXTERNAL_LINKS_IN_BROWSER') == 'true', 'enable_bottom_navigation': os.environ.get('ENABLE_BOTTOM_NAVIGATION') == 'true', 'bottom_navigation_items': json.loads(os.environ.get('BOTTOM_NAVIGATION_ITEMS', '[]')), 'enable_custom_header': os.environ.get('ENABLE_CUSTOM_HEADER') == 'true', 'header_logo_url': os.environ.get('HEADER_LOGO_URL', ''), 'onesignal_app_id': os.environ.get('ONESIGNAL_APP_ID', ''), 'version_name': os.environ.get('VERSION_NAME', '1.0.0'), 'version_code': int(os.environ.get('VERSION_CODE', '1'))}; open('android-template/app/src/main/assets/config.json', 'w').write(json.dumps(config, indent=2)); print('config.json written:'); print(open('android-template/app/src/main/assets/config.json').read())"

      - name: Install Python Pillow
        run: |
          python3 -m pip install Pillow --break-system-packages

      # ── STEP 2 & 3: Process Icon, Package Name, and App Label ─────────────
      - name: Process Icon, Package Name, and App Label
        run: |
          python3 - << 'EOF'
          import os, re, urllib.request, json
          from PIL import Image

          config = json.load(open("build_config.json"))

          icon_url = config.get("icon_url", "")
          app_name = config.get("app_name", "")
          package_name = config.get("package_name", "")
          version_name = config.get("version_name", "1.0.0")
          version_code = config.get("version_code", "1")

          # ── 1. Icon Download and Resizing ──
          if icon_url:
              try:
                  print(f"Downloading icon from {icon_url}...")
                  icon_tmp = "/tmp/app_icon_original.png"
                  urllib.request.urlretrieve(icon_url, icon_tmp)
                  print("Icon downloaded successfully.")

                  # Save to Assets for Splash Activity fallback
                  im = Image.open(icon_tmp)
                  os.makedirs("android-template/app/src/main/assets", exist_ok=True)
                  im.save("android-template/app/src/main/assets/logo.png")

                  # Resize to mipmaps (standard and round)
                  sizes = {
                      "mipmap-mdpi": 48,
                      "mipmap-hdpi": 72,
                      "mipmap-xhdpi": 96,
                      "mipmap-xxhdpi": 144,
                      "mipmap-xxxhdpi": 192
                  }
                  for folder, size in sizes.items():
                      # Standard launcher icon
                      dest = f"android-template/app/src/main/res/{folder}/ic_launcher.png"
                      os.makedirs(os.path.dirname(dest), exist_ok=True)
                      resampling = Image.Resampling.LANCZOS if hasattr(Image, 'Resampling') else Image.LANCZOS
                      resized = im.resize((size, size), resampling)
                      resized.save(dest)
                      
                      # Round launcher icon
                      dest_round = f"android-template/app/src/main/res/{folder}/ic_launcher_round.png"
                      resized.save(dest_round)
                      
                      # OneSignal default icon (transparent background is better, but this will do)
                      dest_onesignal = f"android-template/app/src/main/res/{folder}/ic_stat_onesignal_default.png"
                      resized.save(dest_onesignal)
                      
                      print(f"  Generated standard, round, and onesignal icons for {folder} ({size}x{size}px)")
                  print("All launcher icons processed.")
              except Exception as e:
                  print(f"Warning: Icon processing failed: {e}. Using default template icon.")
          else:
              print("No icon URL provided, using default template icon.")

          # ── 2. Resource App Name Edit ──
          # Update label in strings.xml
          def xml_escape(s):
              return s.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;').replace("'", '&apos;')
          strings_path = "android-template/app/src/main/res/values/strings.xml"
          if os.path.exists(strings_path):
              c = open(strings_path).read()
              escaped_name = xml_escape(app_name)
              c = re.sub(r'<string name="app_name">.*?</string>', f'<string name="app_name">{escaped_name}</string>', c)
              open(strings_path, 'w').write(c)
              print(f"strings.xml app_name updated → {escaped_name}")

          # ── 3. Gradle Package Name & Version Edit ──
          gradle_path = "android-template/app/build.gradle.kts"
          if os.path.exists(gradle_path):
              c = open(gradle_path).read()
              c = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{package_name}"', c)
              c = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{version_name}"', c)
              c = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {version_code}', c)
              open(gradle_path, 'w').write(c)
              print(f"Gradle applicationId updated → {package_name}")
              print(f"Gradle versionName updated → {version_name}")
              print(f"Gradle versionCode updated → {version_code}")
          EOF

      # ── Set up JDK 17 & Gradle ──────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Send Build Starting Callback
        run: |
          BUILD_ID=$(jq -r '.build_id' build_config.json)
          CALLBACK_URL=$(jq -r '.callback_url' build_config.json)
          CALLBACK_TOKEN=$(jq -r '.callback_token' build_config.json)
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"build_id\": \"$BUILD_ID\",
              \"status\": \"building\",
              \"github_run_id\": \"${{ github.run_id }}\",
              \"build_log\": \"[1/4] Environment ready.\n[2/4] App config, icon, and package identity injected.\n[3/4] Compiling Native Android Release (Gradle cache active)...\",
              \"token\": \"$CALLBACK_TOKEN\"
            }" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-template/gradlew

      # ── STEP 4: Build APK and AAB ─────────────────────────────────────────
      - name: Build APK (Release)
        run: |
          BUILD_TYPE=$(jq -r '.build_type' build_config.json)
          if [ "$BUILD_TYPE" = "apk" ] || [ "$BUILD_TYPE" = "both" ]; then
            cd android-template
            ./gradlew assembleRelease --stacktrace 2>&1 | tee ../build_output.log
          fi

      - name: Rename APK output
        run: |
          BUILD_TYPE=$(jq -r '.build_type' build_config.json)
          if [ "$BUILD_TYPE" = "apk" ] || [ "$BUILD_TYPE" = "both" ]; then
            APK_DIR="android-template/app/build/outputs/apk/release"
            APP_NAME=$(jq -r '.app_name' build_config.json)
            APP_SAFE_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-')
          if [ -f "$APK_DIR/app-release.apk" ]; then
            mv "$APK_DIR/app-release.apk" "$APK_DIR/${APP_SAFE_NAME}-release.apk"
            echo "APK renamed to ${APP_SAFE_NAME}-release.apk"
          fi
            if [ -f "$APK_DIR/app-release-unsigned.apk" ]; then
              mv "$APK_DIR/app-release-unsigned.apk" "$APK_DIR/${APP_SAFE_NAME}-release-unsigned.apk"
            fi
          fi

      - name: Build AAB (Release)
        run: |
          BUILD_TYPE=$(jq -r '.build_type' build_config.json)
          if [ "$BUILD_TYPE" = "aab" ] || [ "$BUILD_TYPE" = "both" ]; then
            cd android-template
            ./gradlew bundleRelease --stacktrace 2>&1 | tee -a ../build_output.log
          fi

      - name: Rename AAB output
        run: |
          BUILD_TYPE=$(jq -r '.build_type' build_config.json)
          if [ "$BUILD_TYPE" = "aab" ] || [ "$BUILD_TYPE" = "both" ]; then
            AAB_DIR="android-template/app/build/outputs/bundle/release"
            APP_NAME=$(jq -r '.app_name' build_config.json)
            APP_SAFE_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-')
          if [ -f "$AAB_DIR/app-release.aab" ]; then
            mv "$AAB_DIR/app-release.aab" "$AAB_DIR/${APP_SAFE_NAME}-release.aab"
              echo "AAB renamed to ${APP_SAFE_NAME}-release.aab"
            fi
          fi

      # ── STEP 5: Upload to Cloudflare R2 or uguu.se fallback ──────────────
      - name: Send Uploading Callback
        if: success()
        run: |
          BUILD_ID=$(jq -r '.build_id' build_config.json)
          CALLBACK_URL=$(jq -r '.callback_url' build_config.json)
          CALLBACK_TOKEN=$(jq -r '.callback_token' build_config.json)
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"build_id\": \"$BUILD_ID\",
              \"status\": \"building\",
              \"github_run_id\": \"${{ github.run_id }}\",
              \"build_log\": \"[3/4] Compilation complete!\n[4/4] Uploading build files...\",
              \"token\": \"$CALLBACK_TOKEN\"
            }" || true

      - name: Upload and Dispatch Completed Callback
        if: success()
        run: |
          R2_KEY=$(jq -r '.r2_key' build_config.json)
          R2_SECRET=$(jq -r '.r2_secret' build_config.json)
          export AWS_ACCESS_KEY_ID="$R2_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET"
          export AWS_DEFAULT_REGION="auto"
          
          APK_URL=""
          AAB_URL=""
          PKG_NAME=$(jq -r '.package_name' build_config.json)
          BUILD_ID=$(jq -r '.build_id' build_config.json)
          APP_NAME=$(jq -r '.app_name' build_config.json)
          APP_SAFE_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-')
          R2_BUCKET=$(jq -r '.r2_bucket' build_config.json)
          R2_ENDPOINT=$(jq -r '.r2_endpoint' build_config.json)
          R2_PUBLIC_URL=$(jq -r '.r2_public_url' build_config.json)

          # ── APK ──────────────────────────────────────────────────────────
          APK_FILE="android-template/app/build/outputs/apk/release/${APP_SAFE_NAME}-release.apk"
          if [ -f "$APK_FILE" ]; then
            if [ -n "$R2_KEY" ] && [ "$R2_KEY" != "null" ]; then
              R2_KEY_FILE="$PKG_NAME/builds/apk/${APP_SAFE_NAME}-release-${BUILD_ID}.apk"
              if aws s3 cp "$APK_FILE" "s3://$R2_BUCKET/$R2_KEY_FILE" \
                  --endpoint-url "$R2_ENDPOINT" 2>&1; then
                PUBLIC_URL="$R2_PUBLIC_URL"
                APK_URL="${PUBLIC_URL%/}/$R2_KEY_FILE"
                echo "APK uploaded to R2: $APK_URL"
              else
                echo "R2 upload failed, falling back to uguu.se..."
                RESP=$(curl -s -F "files[]=@$APK_FILE" https://uguu.se/upload.php)
                APK_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
              fi
            else
              echo "No R2 credentials, uploading to uguu.se..."
              RESP=$(curl -s -F "files[]=@$APK_FILE" https://uguu.se/upload.php)
              APK_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
            fi
            echo "APK URL: $APK_URL"
          fi

          # ── AAB ──────────────────────────────────────────────────────────
          AAB_FILE="android-template/app/build/outputs/bundle/release/${APP_SAFE_NAME}-release.aab"
          if [ -f "$AAB_FILE" ]; then
            if [ -n "$R2_KEY" ] && [ "$R2_KEY" != "null" ]; then
              R2_KEY_FILE="$PKG_NAME/builds/aab/${APP_SAFE_NAME}-release-${BUILD_ID}.aab"
              if aws s3 cp "$AAB_FILE" "s3://$R2_BUCKET/$R2_KEY_FILE" \
                  --endpoint-url "$R2_ENDPOINT" 2>&1; then
                PUBLIC_URL="$R2_PUBLIC_URL"
                AAB_URL="${PUBLIC_URL%/}/$R2_KEY_FILE"
                echo "AAB uploaded to R2: $AAB_URL"
              else
                echo "AAB upload failed, falling back to uguu.se..."
                RESP=$(curl -s -F "files[]=@$AAB_FILE" https://uguu.se/upload.php)
                AAB_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
              fi
            else
              echo "No R2 credentials, uploading to uguu.se..."
              RESP=$(curl -s -F "files[]=@$AAB_FILE" https://uguu.se/upload.php)
              AAB_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
            fi
            echo "AAB URL: $AAB_URL"
          fi

          # ── Final callback ────────────────────────────────────────────────
          CALLBACK_URL=$(jq -r '.callback_url' build_config.json)
          CALLBACK_TOKEN=$(jq -r '.callback_token' build_config.json)
          curl -X POST "$CALLBACK_URL" \
            -F "build_id=$BUILD_ID" \
            -F "status=completed" \
            -F "github_run_id=${{ github.run_id }}" \
            -F "token=$CALLBACK_TOKEN" \
            -F "apk_url=$APK_URL" \
            -F "aab_url=$AAB_URL"

      # ── FAILURE handler ───────────────────────────────────────────────────
      - name: Handle Workflow Failure
        if: failure()
        run: |
          LOG_CONTENT="Build failed."
          if [ -f "build_output.log" ]; then
            LOG_CONTENT=$(tail -n 200 build_output.log | jq -aRs .)
          else
            LOG_CONTENT='"No build log available. Check GitHub Actions panel."'
          fi

          BUILD_ID=$(jq -r '.build_id' build_config.json)
          CALLBACK_URL=$(jq -r '.callback_url' build_config.json)
          CALLBACK_TOKEN=$(jq -r '.callback_token' build_config.json)

          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"build_id\": \"$BUILD_ID\",
              \"status\": \"failed\",
              \"github_run_id\": \"${{ github.run_id }}\",
              \"build_log\": $LOG_CONTENT,
              \"token\": \"$CALLBACK_TOKEN\"
            }"
