name: Build Android App

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App Database ID'
        required: true
      build_id:
        description: 'Build Database ID'
        required: true
      app_name:
        description: 'Application Label Name'
        required: true
      package_name:
        description: 'Android Package Name'
        required: true
      website_url:
        description: 'Target Website URL'
        required: true
      icon_url:
        description: 'Icon URL'
        required: false
      splash_url:
        description: 'Splash Screen Image URL'
        required: false
      enable_pull_refresh:
        description: 'Enable Pull to Refresh (true/false)'
        required: true
        default: 'false'
      enable_offline_page:
        description: 'Enable Offline Page (true/false)'
        required: true
        default: 'false'
      enable_push_notification:
        description: 'Enable Push Notifications (true/false)'
        required: true
        default: 'false'
      onesignal_app_id:
        description: 'OneSignal App ID'
        required: false
      enable_admob:
        description: 'Enable Google AdMob (true/false)'
        required: true
        default: 'false'
      admob_app_id:
        description: 'AdMob App ID'
        required: false
      admob_banner_unit_id:
        description: 'AdMob Banner Unit ID'
        required: false
      admob_interstitial_unit_id:
        description: 'AdMob Interstitial Unit ID'
        required: false
      build_type:
        description: 'Build Format (apk, aab, both)'
        required: true
        default: 'both'
      callback_url:
        description: 'Webhook Callback URL'
        required: true
      callback_token:
        description: 'Callback Authentication Token'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Send Starting Status Callback
        run: |
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "building",
              "github_run_id": "${{ github.run_id }}",
              "build_log": "[Stage 1/5] Code checked out. Setting up JDK & Flutter SDK...",
              "token": "${{ github.event.inputs.callback_token }}"
            }'

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.pub-cache
            flutter-template/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter-template/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd flutter-template
          flutter pub get

      - name: Send Dependencies Installed Callback
        run: |
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "building",
              "github_run_id": "${{ github.run_id }}",
              "build_log": "[Stage 1/5] Java & Flutter environments ready.\n[Stage 2/5] Flutter packages installed successfully. Ready to customize...",
              "token": "${{ github.event.inputs.callback_token }}"
            }'

      - name: Generate Dynamic Config JSON
        run: |
          cat <<EOF > flutter-template/assets/config.json
          {
            "app_name": "${{ github.event.inputs.app_name }}",
            "website_url": "${{ github.event.inputs.website_url }}",
            "package_name": "${{ github.event.inputs.package_name }}",
            "enable_pull_refresh": ${{ github.event.inputs.enable_pull_refresh }},
            "enable_offline_page": ${{ github.event.inputs.enable_offline_page }},
            "enable_push_notification": ${{ github.event.inputs.enable_push_notification }},
            "onesignal_app_id": "${{ github.event.inputs.onesignal_app_id }}",
            "enable_admob": ${{ github.event.inputs.enable_admob }},
            "admob_app_id": "${{ github.event.inputs.admob_app_id }}",
            "admob_banner_unit_id": "${{ github.event.inputs.admob_banner_unit_id }}",
            "admob_interstitial_unit_id": "${{ github.event.inputs.admob_interstitial_unit_id }}"
          }
          EOF

      - name: Download Launcher Icon
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          curl -L -o flutter-template/assets/logo.png "${{ github.event.inputs.icon_url }}"

      - name: Setup Launcher Icons Config
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          cat <<EOF > flutter-template/flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/logo.png"
            min_sdk_android: 21
          EOF
          cd flutter-template
          flutter pub add flutter_launcher_icons --dev
          flutter pub run flutter_launcher_icons:main

      - name: Replace Package Name and App Label
        run: |
          # Use a python script to quickly modify package name and app labels in Android folders
          python3 - <<EOF
          import os, re

          app_name = "${{ github.event.inputs.app_name }}"
          package_name = "${{ github.event.inputs.package_name }}"
          
          # 1. Update AndroidManifest.xml application label
          manifest_path = "flutter-template/android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              content = re.sub(r'android:label="[^"]+"', f'android:label="{app_name}"', content)
              with open(manifest_path, 'w') as f:
                  f.write(content)
                  
          # 2. Update build.gradle.kts applicationId and namespace (Kotlin DSL support)
          gradle_path = "flutter-template/android/app/build.gradle.kts"
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()
              content = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{package_name}"', content)
              content = re.sub(r'namespace\s*=\s*"[^"]+"', f'namespace = "{package_name}"', content)
              with open(gradle_path, 'w') as f:
                  f.write(content)
          EOF

      - name: Send Asset Injection Callback
        run: |
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "building",
              "github_run_id": "${{ github.run_id }}",
              "build_log": "[Stage 2/5] Dependencies ready.\n[Stage 3/5] App package identity, app label name, permissions, and launcher icons injected successfully.",
              "token": "${{ github.event.inputs.callback_token }}"
            }'

      - name: Send Starting Compilation Callback
        run: |
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "building",
              "github_run_id": "${{ github.run_id }}",
              "build_log": "[Stage 3/5] Customization complete.\n[Stage 4/5] Starting Flutter release build (Compiling Gradle task assembleRelease/bundleRelease)... This will take 1-2 minutes.",
              "token": "${{ github.event.inputs.callback_token }}"
            }'

      - name: Build APK (Release)
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        run: |
          cd flutter-template
          flutter build apk --release > ../build_output.log 2>&1

      - name: Build AAB (Release)
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        run: |
          cd flutter-template
          flutter build appbundle --release >> ../build_output.log 2>&1

      - name: Send Uploading Callback
        if: success()
        run: |
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "building",
              "github_run_id": "${{ github.run_id }}",
              "build_log": "[Stage 4/5] Compilation complete.\n[Stage 5/5] Uploading binaries to secure transfer storage...",
              "token": "${{ github.event.inputs.callback_token }}"
            }'

      - name: Dispatch Completed Status with Files
        if: success()
        run: |
          APK_URL=""
          AAB_URL=""
          
          if [ -f "flutter-template/build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "Uploading APK to transfer.sh..."
            APK_URL=$(curl -s --upload-file flutter-template/build/app/outputs/flutter-apk/app-release.apk https://transfer.sh/app-release.apk)
            echo "APK URL: $APK_URL"
          fi
          
          if [ -f "flutter-template/build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "Uploading AAB to transfer.sh..."
            AAB_URL=$(curl -s --upload-file flutter-template/build/app/outputs/bundle/release/app-release.aab https://transfer.sh/app-release.aab)
            echo "AAB URL: $AAB_URL"
          fi
          
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -F "build_id=${{ github.event.inputs.build_id }}" \
            -F "status=completed" \
            -F "github_run_id=${{ github.run_id }}" \
            -F "token=${{ github.event.inputs.callback_token }}" \
            -F "apk_url=$APK_URL" \
            -F "aab_url=$AAB_URL"

      - name: Handle Workflow Failure
        if: failure()
        run: |
          LOG_CONTENT="GitHub Workflow execution failed."
          if [ -f "build_output.log" ]; then
            # Clean up the log content to be JSON safe
            LOG_CONTENT=$(tail -n 250 build_output.log | jq -aRs .)
          else
            LOG_CONTENT='"No build logs generated. Please check GitHub panel."'
          fi
          
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"build_id\": \"${{ github.event.inputs.build_id }}\",
              \"status\": \"failed\",
              \"github_run_id\": \"${{ github.run_id }}\",
              \"build_log\": $LOG_CONTENT,
              \"token\": \"${{ github.event.inputs.callback_token }}\"
            }"
