name: Build Android App

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App Database ID'
        required: true
      build_id:
        description: 'Build Database ID'
        required: true
      app_name:
        description: 'Application Label Name'
        required: true
      package_name:
        description: 'Android Package Name'
        required: true
      website_url:
        description: 'Target Website URL'
        required: true
      icon_url:
        description: 'Icon URL'
        required: false
      splash_url:
        description: 'Splash Screen Image URL'
        required: false
      enable_pull_refresh:
        description: 'Enable Pull to Refresh (true/false)'
        required: true
        default: 'false'
      enable_offline_page:
        description: 'Enable Offline Page (true/false)'
        required: true
        default: 'false'
      enable_push_notification:
        description: 'Enable Push Notification via OneSignal (true/false)'
        required: true
        default: 'false'
      onesignal_app_id:
        description: 'OneSignal App ID'
        required: false
        default: ''

      build_type:
        description: 'Build Format (apk, aab, both)'
        required: true
        default: 'apk'
      callback_url:
        description: 'Webhook Callback URL'
        required: true
      callback_token:
        description: 'Callback Authentication Token'
        required: true
      r2_key:
        description: 'Cloudflare R2 Access Key'
        required: false
      r2_secret:
        description: 'Cloudflare R2 Secret Key'
        required: false
      r2_bucket:
        description: 'Cloudflare R2 Bucket'
        required: false
      r2_endpoint:
        description: 'Cloudflare R2 Endpoint'
        required: false
      r2_public_url:
        description: 'Cloudflare R2 Public URL'
        required: false
      storage_driver:
        description: 'Active Storage Driver'
        required: false
        default: 'local'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Send Starting Status Callback
        run: |
          curl -s -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "building",
              "github_run_id": "${{ github.run_id }}",
              "build_log": "[1/4] Setting up build environment...",
              "token": "${{ github.event.inputs.callback_token }}"
            }' || true

      # ── STEP 1: Inject config.json ────────────────────────────────────────
      - name: Inject App Config
        run: |
          mkdir -p android-template/app/src/main/assets
          cat > android-template/app/src/main/assets/config.json << 'EOF'
          {
            "app_name": "${{ github.event.inputs.app_name }}",
            "website_url": "${{ github.event.inputs.website_url }}",
            "package_name": "${{ github.event.inputs.package_name }}",
            "enable_pull_refresh": ${{ github.event.inputs.enable_pull_refresh }},
            "enable_offline_page": ${{ github.event.inputs.enable_offline_page }},
            "enable_push_notification": ${{ github.event.inputs.enable_push_notification }},
            "onesignal_app_id": "${{ github.event.inputs.onesignal_app_id }}"
          }
          EOF
          echo "config.json written:"
          cat android-template/app/src/main/assets/config.json

      - name: Install Python Pillow
        run: |
          python3 -m pip install Pillow --break-system-packages

      # ── STEP 2 & 3: Process Icon, Package Name, and App Label ─────────────
      - name: Process Icon, Package Name, and App Label
        run: |
          python3 - << 'EOF'
          import os, re, urllib.request
          from PIL import Image

          icon_url = "${{ github.event.inputs.icon_url }}"
          app_name = "${{ github.event.inputs.app_name }}"
          package_name = "${{ github.event.inputs.package_name }}"

          # ── 1. Icon Download and Resizing ──
          if icon_url:
              try:
                  print(f"Downloading icon from {icon_url}...")
                  icon_tmp = "/tmp/app_icon_original.png"
                  urllib.request.urlretrieve(icon_url, icon_tmp)
                  print("Icon downloaded successfully.")

                  # Save to Assets for Splash Activity fallback
                  im = Image.open(icon_tmp)
                  os.makedirs("android-template/app/src/main/assets", exist_ok=True)
                  im.save("android-template/app/src/main/assets/logo.png")

                  # Resize to mipmaps (standard and round)
                  sizes = {
                      "mipmap-mdpi": 48,
                      "mipmap-hdpi": 72,
                      "mipmap-xhdpi": 96,
                      "mipmap-xxhdpi": 144,
                      "mipmap-xxxhdpi": 192
                  }
                  for folder, size in sizes.items():
                      # Standard launcher icon
                      dest = f"android-template/app/src/main/res/{folder}/ic_launcher.png"
                      os.makedirs(os.path.dirname(dest), exist_ok=True)
                      resampling = Image.Resampling.LANCZOS if hasattr(Image, 'Resampling') else Image.LANCZOS
                      resized = im.resize((size, size), resampling)
                      resized.save(dest)
                      
                      # Round launcher icon
                      dest_round = f"android-template/app/src/main/res/{folder}/ic_launcher_round.png"
                      resized.save(dest_round)
                      print(f"  Generated standard & round {folder} ({size}x{size}px)")
                  print("All launcher icons processed.")
              except Exception as e:
                  print(f"Warning: Icon processing failed: {e}. Using default template icon.")
          else:
              print("No icon URL provided, using default template icon.")

          # ── 2. Resource App Name Edit ──
          # Update label in strings.xml instead of AndroidManifest.xml directly
          strings_path = "android-template/app/src/main/res/values/strings.xml"
          if os.path.exists(strings_path):
              c = open(strings_path).read()
              c = re.sub(r'<string name="app_name">.*?</string>', f'<string name="app_name">{app_name}</string>', c)
              open(strings_path, 'w').write(c)
              print(f"strings.xml app_name updated → {app_name}")

          # ── 3. Gradle Package Name Edit ──
          # Update applicationId in build.gradle.kts
          gradle_path = "android-template/app/build.gradle.kts"
          if os.path.exists(gradle_path):
              c = open(gradle_path).read()
              c = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{package_name}"', c)
              open(gradle_path, 'w').write(c)
              print(f"Gradle applicationId updated → {package_name}")
          EOF

      # ── Set up JDK 17 & Gradle ──────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Send Build Starting Callback
        run: |
          curl -s -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "building",
              "github_run_id": "${{ github.run_id }}",
              "build_log": "[1/4] Environment ready.\n[2/4] App config, icon, and package identity injected.\n[3/4] Compiling Native Android Release (Gradle cache active)...",
              "token": "${{ github.event.inputs.callback_token }}"
            }' || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-template/gradlew

      # ── STEP 4: Build APK and AAB ─────────────────────────────────────────
      - name: Build APK (Release)
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        run: |
          cd android-template
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../build_output.log

      - name: Build AAB (Release)
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        run: |
          cd android-template
          ./gradlew bundleRelease --stacktrace 2>&1 | tee -a ../build_output.log

      # ── STEP 5: Upload to Cloudflare R2 or uguu.se fallback ──────────────
      - name: Send Uploading Callback
        if: success()
        run: |
          curl -s -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "building",
              "github_run_id": "${{ github.run_id }}",
              "build_log": "[3/4] Compilation complete!\n[4/4] Uploading build files...",
              "token": "${{ github.event.inputs.callback_token }}"
            }' || true

      - name: Upload and Dispatch Completed Callback
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ github.event.inputs.r2_key }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event.inputs.r2_secret }}
          AWS_DEFAULT_REGION: auto
        run: |
          APK_URL=""
          AAB_URL=""
          PKG_NAME="${{ github.event.inputs.package_name }}"
          BUILD_ID="${{ github.event.inputs.build_id }}"

          # ── APK ──────────────────────────────────────────────────────────
          APK_FILE="android-template/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_FILE" ]; then
            if [ -n "${{ github.event.inputs.r2_key }}" ]; then
              R2_KEY="$PKG_NAME/builds/apk/app-release-${BUILD_ID}.apk"
              if aws s3 cp "$APK_FILE" "s3://${{ github.event.inputs.r2_bucket }}/$R2_KEY" \
                  --endpoint-url "${{ github.event.inputs.r2_endpoint }}" 2>&1; then
                PUBLIC_URL="${{ github.event.inputs.r2_public_url }}"
                APK_URL="${PUBLIC_URL%/}/$R2_KEY"
                echo "APK uploaded to R2: $APK_URL"
              else
                echo "R2 upload failed, falling back to uguu.se..."
                RESP=$(curl -s -F "files[]=@$APK_FILE" https://uguu.se/upload.php)
                APK_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
              fi
            else
              echo "No R2 credentials, uploading to uguu.se..."
              RESP=$(curl -s -F "files[]=@$APK_FILE" https://uguu.se/upload.php)
              APK_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
            fi
            echo "APK URL: $APK_URL"
          fi

          # ── AAB ──────────────────────────────────────────────────────────
          AAB_FILE="android-template/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_FILE" ]; then
            if [ -n "${{ github.event.inputs.r2_key }}" ]; then
              R2_KEY="$PKG_NAME/builds/aab/app-release-${BUILD_ID}.aab"
              if aws s3 cp "$AAB_FILE" "s3://${{ github.event.inputs.r2_bucket }}/$R2_KEY" \
                  --endpoint-url "${{ github.event.inputs.r2_endpoint }}" 2>&1; then
                PUBLIC_URL="${{ github.event.inputs.r2_public_url }}"
                AAB_URL="${PUBLIC_URL%/}/$R2_KEY"
                echo "AAB uploaded to R2: $AAB_URL"
              else
                echo "R2 AAB upload failed, falling back to uguu.se..."
                RESP=$(curl -s -F "files[]=@$AAB_FILE" https://uguu.se/upload.php)
                AAB_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
              fi
            else
              RESP=$(curl -s -F "files[]=@$AAB_FILE" https://uguu.se/upload.php)
              AAB_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
            fi
            echo "AAB URL: $AAB_URL"
          fi

          # ── Final callback ────────────────────────────────────────────────
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -F "build_id=${{ github.event.inputs.build_id }}" \
            -F "status=completed" \
            -F "github_run_id=${{ github.run_id }}" \
            -F "token=${{ github.event.inputs.callback_token }}" \
            -F "apk_url=$APK_URL" \
            -F "aab_url=$AAB_URL"

      # ── FAILURE handler ───────────────────────────────────────────────────
      - name: Handle Workflow Failure
        if: failure()
        run: |
          LOG_CONTENT="Build failed."
          if [ -f "build_output.log" ]; then
            LOG_CONTENT=$(tail -n 200 build_output.log | jq -aRs .)
          else
            LOG_CONTENT='"No build log available. Check GitHub Actions panel."'
          fi

          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"build_id\": \"${{ github.event.inputs.build_id }}\",
              \"status\": \"failed\",
              \"github_run_id\": \"${{ github.run_id }}\",
              \"build_log\": $LOG_CONTENT,
              \"token\": \"${{ github.event.inputs.callback_token }}\"
            }"
