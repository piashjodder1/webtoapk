name: Build Android App

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App Database ID'
        required: true
      build_id:
        description: 'Build Database ID'
        required: true
      app_name:
        description: 'Application Label Name'
        required: true
      package_name:
        description: 'Android Package Name'
        required: true
      website_url:
        description: 'Target Website URL'
        required: true
      icon_url:
        description: 'Icon URL'
        required: false
      splash_url:
        description: 'Splash Screen Image URL'
        required: false
      enable_pull_refresh:
        description: 'Enable Pull to Refresh (true/false)'
        required: true
        default: 'false'
      enable_offline_page:
        description: 'Enable Offline Page (true/false)'
        required: true
        default: 'false'
      enable_push_notification:
        description: 'Enable Push Notifications (true/false)'
        required: true
        default: 'false'
      onesignal_app_id:
        description: 'OneSignal App ID'
        required: false
      enable_admob:
        description: 'Enable Google AdMob (true/false)'
        required: true
        default: 'false'
      admob_app_id:
        description: 'AdMob App ID'
        required: false
      admob_banner_unit_id:
        description: 'AdMob Banner Unit ID'
        required: false
      admob_interstitial_unit_id:
        description: 'AdMob Interstitial Unit ID'
        required: false
      build_type:
        description: 'Build Format (apk, aab, both)'
        required: true
        default: 'apk'
      callback_url:
        description: 'Webhook Callback URL'
        required: true
      callback_token:
        description: 'Callback Authentication Token'
        required: true
      r2_key:
        description: 'Cloudflare R2 Access Key'
        required: false
      r2_secret:
        description: 'Cloudflare R2 Secret Key'
        required: false
      r2_bucket:
        description: 'Cloudflare R2 Bucket'
        required: false
      r2_endpoint:
        description: 'Cloudflare R2 Endpoint'
        required: false
      r2_public_url:
        description: 'Cloudflare R2 Public URL'
        required: false
      storage_driver:
        description: 'Active Storage Driver'
        required: false
        default: 'local'

jobs:
  build:
    runs-on: ubuntu-latest
    # PUB_CACHE points to vendor folder — no network download needed
    env:
      PUB_CACHE: ${{ github.workspace }}/flutter-template/vendor

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Send Starting Status Callback
        run: |
          curl -s -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "building",
              "github_run_id": "${{ github.run_id }}",
              "build_log": "[1/4] Setting up build environment...",
              "token": "${{ github.event.inputs.callback_token }}"
            }' || true

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── STEP 1: Inject config.json (no download needed) ───────────────────
      - name: Inject App Config
        run: |
          cat > flutter-template/assets/config.json << 'EOF'
          {
            "app_name": "${{ github.event.inputs.app_name }}",
            "website_url": "${{ github.event.inputs.website_url }}",
            "package_name": "${{ github.event.inputs.package_name }}",
            "enable_pull_refresh": ${{ github.event.inputs.enable_pull_refresh }},
            "enable_offline_page": ${{ github.event.inputs.enable_offline_page }},
            "enable_push_notification": ${{ github.event.inputs.enable_push_notification }},
            "onesignal_app_id": "${{ github.event.inputs.onesignal_app_id }}",
            "enable_admob": ${{ github.event.inputs.enable_admob }},
            "admob_app_id": "${{ github.event.inputs.admob_app_id }}",
            "admob_banner_unit_id": "${{ github.event.inputs.admob_banner_unit_id }}",
            "admob_interstitial_unit_id": "${{ github.event.inputs.admob_interstitial_unit_id }}"
          }
          EOF
          echo "config.json written:"
          cat flutter-template/assets/config.json

      # ── STEP 2: Replace icon using ImageMagick (pre-installed, no pip) ────
      - name: Download and Resize Launcher Icon
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          ICON_URL="${{ github.event.inputs.icon_url }}"
          ICON_TMP="/tmp/app_icon_original.png"

          echo "Downloading icon from $ICON_URL..."
          if curl -fsSL --max-time 15 -o "$ICON_TMP" "$ICON_URL"; then
            echo "Icon downloaded ($(du -sh $ICON_TMP | cut -f1))"

            # Copy to Flutter assets
            cp "$ICON_TMP" flutter-template/assets/logo.png

            # Resize to all Android mipmap densities using ImageMagick (pre-installed)
            declare -A SIZES=(
              ["mipmap-mdpi"]=48
              ["mipmap-hdpi"]=72
              ["mipmap-xhdpi"]=96
              ["mipmap-xxhdpi"]=144
              ["mipmap-xxxhdpi"]=192
            )
            for FOLDER in "${!SIZES[@]}"; do
              SIZE="${SIZES[$FOLDER]}"
              DEST="flutter-template/android/app/src/main/res/${FOLDER}/ic_launcher.png"
              mkdir -p "$(dirname $DEST)"
              convert "$ICON_TMP" -resize "${SIZE}x${SIZE}" "$DEST"
              echo "  Generated $DEST (${SIZE}x${SIZE}px)"
            done
            echo "All launcher icons replaced successfully."
          else
            echo "Warning: Failed to download icon from $ICON_URL. Using default template icon."
          fi

      # ── STEP 3: Replace Package Name and App Label in Android files ───────
      - name: Replace Package Name and App Label
        run: |
          python3 - << 'EOF'
          import os, re

          app_name    = "${{ github.event.inputs.app_name }}"
          package_name = "${{ github.event.inputs.package_name }}"

          # 1. AndroidManifest.xml — update label
          manifest = "flutter-template/android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest):
              c = open(manifest).read()
              c = re.sub(r'android:label="[^"]+"', f'android:label="{app_name}"', c)
              open(manifest, 'w').write(c)
              print(f"Manifest label → {app_name}")

          # 2. build.gradle.kts — update applicationId and namespace
          gradle = "flutter-template/android/app/build.gradle.kts"
          if os.path.exists(gradle):
              c = open(gradle).read()
              c = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{package_name}"', c)
              c = re.sub(r'namespace\s*=\s*"[^"]+"',    f'namespace = "{package_name}"',    c)
              open(gradle, 'w').write(c)
              print(f"Gradle applicationId/namespace → {package_name}")
          EOF

      - name: Send Build Starting Callback
        run: |
          curl -s -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "building",
              "github_run_id": "${{ github.run_id }}",
              "build_log": "[1/4] Environment ready.\n[2/4] App config, icon, and package identity injected.\n[3/4] Compiling Flutter APK (using cached Gradle)...",
              "token": "${{ github.event.inputs.callback_token }}"
            }' || true

      # ── STEP 4: Build — pub get from vendor (offline), then compile ───────
      - name: Flutter pub get (offline from vendor)
        run: |
          cd flutter-template
          flutter pub get --offline

      - name: Build APK (Release)
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        run: |
          cd flutter-template
          flutter build apk --release --no-pub > ../build_output.log 2>&1

      - name: Build AAB (Release)
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        run: |
          cd flutter-template
          flutter build appbundle --release --no-pub >> ../build_output.log 2>&1

      # ── STEP 5: Upload to Cloudflare R2 or uguu.se fallback ──────────────
      - name: Send Uploading Callback
        if: success()
        run: |
          curl -s -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_id": "${{ github.event.inputs.build_id }}",
              "status": "building",
              "github_run_id": "${{ github.run_id }}",
              "build_log": "[3/4] Compilation complete!\n[4/4] Uploading build files...",
              "token": "${{ github.event.inputs.callback_token }}"
            }' || true

      - name: Upload and Dispatch Completed Callback
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ github.event.inputs.r2_key }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event.inputs.r2_secret }}
          AWS_DEFAULT_REGION: auto
        run: |
          APK_URL=""
          AAB_URL=""
          PKG_NAME="${{ github.event.inputs.package_name }}"
          BUILD_ID="${{ github.event.inputs.build_id }}"

          # ── APK ──────────────────────────────────────────────────────────
          APK_FILE="flutter-template/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_FILE" ]; then
            if [ -n "${{ github.event.inputs.r2_key }}" ]; then
              R2_KEY="$PKG_NAME/builds/apk/app-release-${BUILD_ID}.apk"
              if aws s3 cp "$APK_FILE" "s3://${{ github.event.inputs.r2_bucket }}/$R2_KEY" \
                  --endpoint-url "${{ github.event.inputs.r2_endpoint }}" 2>&1; then
                PUBLIC_URL="${{ github.event.inputs.r2_public_url }}"
                APK_URL="${PUBLIC_URL%/}/$R2_KEY"
                echo "APK uploaded to R2: $APK_URL"
              else
                echo "R2 upload failed, falling back to uguu.se..."
                RESP=$(curl -s -F "files[]=@$APK_FILE" https://uguu.se/upload.php)
                APK_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
              fi
            else
              echo "No R2 credentials, uploading to uguu.se..."
              RESP=$(curl -s -F "files[]=@$APK_FILE" https://uguu.se/upload.php)
              APK_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
            fi
            echo "APK URL: $APK_URL"
          fi

          # ── AAB ──────────────────────────────────────────────────────────
          AAB_FILE="flutter-template/build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_FILE" ]; then
            if [ -n "${{ github.event.inputs.r2_key }}" ]; then
              R2_KEY="$PKG_NAME/builds/aab/app-release-${BUILD_ID}.aab"
              if aws s3 cp "$AAB_FILE" "s3://${{ github.event.inputs.r2_bucket }}/$R2_KEY" \
                  --endpoint-url "${{ github.event.inputs.r2_endpoint }}" 2>&1; then
                PUBLIC_URL="${{ github.event.inputs.r2_public_url }}"
                AAB_URL="${PUBLIC_URL%/}/$R2_KEY"
                echo "AAB uploaded to R2: $AAB_URL"
              else
                echo "R2 AAB upload failed, falling back to uguu.se..."
                RESP=$(curl -s -F "files[]=@$AAB_FILE" https://uguu.se/upload.php)
                AAB_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
              fi
            else
              RESP=$(curl -s -F "files[]=@$AAB_FILE" https://uguu.se/upload.php)
              AAB_URL=$(echo "$RESP" | jq -r '.files[0].url // empty')
            fi
            echo "AAB URL: $AAB_URL"
          fi

          # ── Final callback ────────────────────────────────────────────────
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -F "build_id=${{ github.event.inputs.build_id }}" \
            -F "status=completed" \
            -F "github_run_id=${{ github.run_id }}" \
            -F "token=${{ github.event.inputs.callback_token }}" \
            -F "apk_url=$APK_URL" \
            -F "aab_url=$AAB_URL"

      # ── FAILURE handler ───────────────────────────────────────────────────
      - name: Handle Workflow Failure
        if: failure()
        run: |
          LOG_CONTENT="Build failed."
          if [ -f "build_output.log" ]; then
            LOG_CONTENT=$(tail -n 200 build_output.log | jq -aRs .)
          else
            LOG_CONTENT='"No build log available. Check GitHub Actions panel."'
          fi

          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"build_id\": \"${{ github.event.inputs.build_id }}\",
              \"status\": \"failed\",
              \"github_run_id\": \"${{ github.run_id }}\",
              \"build_log\": $LOG_CONTENT,
              \"token\": \"${{ github.event.inputs.callback_token }}\"
            }"
