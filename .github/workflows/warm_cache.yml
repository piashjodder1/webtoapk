name: Warm Build Cache

on:
  workflow_dispatch:
  # Run every Sunday to refresh caches before they expire (7-day TTL)
  schedule:
    - cron: '0 2 * * 0'

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle (Warm Gradle Cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Flutter SDK (Warm Flutter Cache)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set PUB_CACHE to vendor folder
        run: echo "PUB_CACHE=${{ github.workspace }}/flutter-template/vendor" >> $GITHUB_ENV

      - name: Verify vendor packages
        run: |
          echo "PUB_CACHE=$PUB_CACHE"
          ls $PUB_CACHE/hosted/pub.dev/ | head -20
          echo "Total packages: $(ls $PUB_CACHE/hosted/pub.dev/ | wc -l)"

      - name: Flutter pub get (offline from vendor)
        run: |
          cd flutter-template
          flutter pub get --offline

      - name: Inject dummy config.json for warm build
        run: |
          cat > flutter-template/assets/config.json << 'EOF'
          {
            "app_name": "Cache Warm Build",
            "website_url": "https://example.com",
            "package_name": "com.example.warmup",
            "enable_pull_refresh": false,
            "enable_offline_page": true,
            "enable_push_notification": false,
            "onesignal_app_id": "",
            "enable_admob": false,
            "admob_app_id": "",
            "admob_banner_unit_id": "",
            "admob_interstitial_unit_id": ""
          }
          EOF

      - name: Full APK Build (Warm Gradle Cache)
        run: |
          cd flutter-template
          flutter build apk --release --no-pub
          echo "✅ Gradle cache is now warm for future builds!"

      - name: Report Cache Status
        run: |
          echo "Build complete. Gradle and Flutter caches are now saved."
          echo "Next build should complete in ~60 seconds."
