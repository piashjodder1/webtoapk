name: website_to_app_template
description: A production-ready Flutter WebView template with push notifications, AdMob ads, pull to refresh, and offline detection.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.2
  connectivity_plus: ^5.0.2
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.10
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/offline.html
    - assets/logo.png
